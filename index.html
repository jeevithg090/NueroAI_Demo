<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeuroLearn AI — Adaptive learning prototype</title>
    <meta
      name="description"
      content="NeuroLearn AI is an interactive prototype that presents the same school chapter in ADHD-, ASD- and dyslexia-friendly formats, with student, teacher and admin views."
    />
    <meta name="theme-color" content="#0D0F1A" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NeuroLearn AI — Adaptive learning prototype" />
    <meta
      property="og:description"
      content="One curriculum, three adaptive engines: explore the student, teacher and admin journeys."
    />
    <meta property="og:site_name" content="NeuroLearn AI" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NeuroLearn AI — Adaptive learning prototype" />
    <meta
      name="twitter:description"
      content="One curriculum, three adaptive engines: explore the student, teacher and admin journeys."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var saved = localStorage.getItem('neurolearn_theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <noscript>NeuroLearn AI needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
